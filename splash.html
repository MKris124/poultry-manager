<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Indítás...</title>
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
            user-select: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #cbd5e1;
            border-top-color: #3b82f6; /* Kék töltőcsík */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
        h2 { margin: 0; font-size: 1.8rem; color: #1e293b; }
        p { margin-top: 10px; color: #64748b; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Baromfi Menedzser</h2>
    <p>A háttérrendszer indítása folyamatban...</p>
</body>
</html>
