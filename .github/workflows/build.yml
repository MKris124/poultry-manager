name: Build and Release Baromfi Menedzser

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      # 1. NODE.JS ÉS FRONTEND BUILD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Frontend (Angular)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --output-path="../backend/src/main/resources/static" --base-href ./

      # 2. JAVA ÉS BACKEND BUILD
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend (Spring Boot JAR)
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # 3. KÖNYVTÁR ELŐKÉSZÍTÉS (A launcher mappában)
      - name: Prepare Backend Bin Folder
        shell: bash
        run: mkdir -p launcher/backend_bin

      # 4. LAUNCH4J: JAR -> EXE KONVERTÁLÁS
      - name: Download and Run Launch4j
        shell: powershell
        run: |
          # A curl.exe a -L kapcsolóval sikeresen átjut a SourceForge átirányításain!
          curl.exe -L -o launch4j.zip "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-win32.zip/download"
          Expand-Archive -Path launch4j.zip -DestinationPath launch4j_dir
          
          # A launch4j-nek odaadjuk a launcher mappában lévő XML-t
          .\launch4j_dir\launch4j\launch4jc.exe launcher\puoultry_manager.xml

      # 5. ELECTRON PACKAGER: Végleges kliens mappa generálása a launcher-ben
      - name: Build Electron App
        working-directory: ./launcher
        run: |
          npm install
          npx electron-packager . BaromfiMenedzser --platform=win32 --arch=x64 --icon=gooseicon.ico --out=dist --overwrite

      # 6. FRISSÍTŐ ZIP KÉSZÍTÉSE (A korábban kért háttérfrissítéshez)
      - name: Create Update ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "launcher/dist/BaromfiMenedzser-win32-x64/*" -DestinationPath "update.zip" -CompressionLevel Optimal

      # 7. INNO SETUP: Telepítő generálása
      - name: Run Inno Setup Compiler
        working-directory: ./launcher
        run: iscc poultry_manager_setup_script.iss

      # 8. FELTÖLTÉS GITHUB RELEASES-BE
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            launcher/Output/BaromfiMenedzser_Telepito.exe
            update.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}