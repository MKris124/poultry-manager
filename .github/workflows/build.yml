name: Build and Release Baromfi Menedzser

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      # 1. NODE.JS ÉS FRONTEND BUILD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Frontend (Angular)
        working-directory: ./frontend
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm run build -- --base-href ./
          mkdir -p ../backend/src/main/resources/static
          if [ -d "dist/frontend/browser" ]; then
            cp -r dist/frontend/browser/* ../backend/src/main/resources/static/
          else
            cp -r dist/frontend/* ../backend/src/main/resources/static/
          fi

      # 2. JAVA ÉS BACKEND BUILD
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend (Spring Boot JAR)
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # 3. KÖNYVTÁR ELŐKÉSZÍTÉS
      - name: Prepare Folders
        shell: bash
        run: mkdir -p backend_bin
        
      # 4. JRE 17 BEÁGYAZÁSA
      - name: Download JRE 17
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk" -OutFile jre.zip
          Expand-Archive -Path jre.zip -DestinationPath jre_temp
          $jreDir = Get-ChildItem -Path jre_temp | Select-Object -First 1
          Move-Item -Path $jreDir.FullName -Destination backend_bin\jre

      # 5. LAUNCH4J: JAR -> EXE
      - name: Run Launch4j
        shell: powershell
        run: |
          curl.exe -L -o launch4j.zip "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-win32.zip/download"
          Expand-Archive -Path launch4j.zip -DestinationPath launch4j_dir
          .\launch4j_dir\launch4j\launch4jc.exe puoultry_manager.xml

      # 6. KARCSÚ ELECTRON CSOMAGOLÁS (Javított verzió)
      - name: Build Electron App
        shell: bash
        run: |
          # 1. Tiszta munkakönyvtár létrehozása
          mkdir dist_temp
          cp package.json main.js gooseicon.ico dist_temp/
          cp -r backend_bin dist_temp/
          
          cd dist_temp
          
          # 2. Szükséges függőségek telepítése
          # Az Electron-t muszáj telepíteni, különben a packager nem találja
          npm install electron --save-prod
          npm install @electron/packager --save-dev
          
          # 3. Csomagolás indítása
          # Most már a frissített @electron/packager nevet használjuk
          npx electron-packager . BaromfiMenedzser --platform=win32 --arch=x64 --icon=gooseicon.ico --out=../dist --overwrite

      # 7. FRISSÍTŐ ZIP ÉS TELEPÍTŐ
      - name: Create Update ZIP
        shell: powershell
        run: Compress-Archive -Path "dist/BaromfiMenedzser-win32-x64/*" -DestinationPath "update.zip"

      - name: Run Inno Setup
        run: iscc poultry_manager_setup_script.iss

      # 8. RELEASE
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Output/BaromfiMenedzser_Telepito.exe
            update.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}