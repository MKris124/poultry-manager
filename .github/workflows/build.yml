name: Build and Release Baromfi Menedzser

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      # 1. NODE.JS ÉS FRONTEND BUILD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Frontend (Angular)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --output-path="../backend/src/main/resources/static" --base-href ./

      # 2. JAVA ÉS BACKEND BUILD
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend (Spring Boot JAR)
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # 3. KÖNYVTÁR ELŐKÉSZÍTÉS A GYÖKÉRBEN
      - name: Prepare Backend Bin Folder
        shell: bash
        run: mkdir -p backend_bin

      - name: Download and Bundle JRE 17
        shell: powershell
        run: |
          # Hivatalos Temurin JRE 17 letöltése
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk" -OutFile jre.zip
          Expand-Archive -Path jre.zip -DestinationPath jre_temp
          
          # A kicsomagolt mappa (pl. jdk-17.0.x-jre) átnevezése és mozgatása a backend_bin/jre helyre
          $jreDir = Get-ChildItem -Path jre_temp | Select-Object -First 1
          Move-Item -Path $jreDir.FullName -Destination backend_bin\jre

      # 4. LAUNCH4J: JAR -> EXE KONVERTÁLÁS
      - name: Download and Run Launch4j
        shell: powershell
        run: |
          curl.exe -L -o launch4j.zip "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-win32.zip/download"
          Expand-Archive -Path launch4j.zip -DestinationPath launch4j_dir
          
          # A launch4j-nek odaadjuk a gyökérben lévő XML-t
          .\launch4j_dir\launch4j\launch4jc.exe puoultry_manager.xml

      # 5. ELECTRON PACKAGER: Végleges kliens mappa generálása
      - name: Build Electron App
        run: |
          npm install
          npx electron-packager . BaromfiMenedzser --platform=win32 --arch=x64 --icon=gooseicon.ico --out=dist --overwrite

      # 6. FRISSÍTŐ ZIP KÉSZÍTÉSE (A háttérfrissítéshez)
      - name: Create Update ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist/BaromfiMenedzser-win32-x64/*" -DestinationPath "update.zip" -CompressionLevel Optimal

      # 7. INNO SETUP: Telepítő generálása
      - name: Run Inno Setup Compiler
        run: iscc poultry_manager_setup_script.iss

      # 8. FELTÖLTÉS GITHUB RELEASES-BE
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Output/BaromfiMenedzser_Telepito.exe
            update.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}