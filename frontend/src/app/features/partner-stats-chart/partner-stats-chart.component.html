            <div class="chart-container" style="position: relative; height: 350px;">
                <p-chart type="line" [data]="lineData" [options]="lineOptions" height="350px"></p-chart>
            </div>
            <div class="text-xs text-500 mt-2 text-center">
                * A bal tengely a májsúlyt, a jobb tengely a kóser százalékot mutatja.
            </div>
        </div>
    </div>
